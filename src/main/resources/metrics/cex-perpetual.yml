version: cex-perpetual-v1
concepts: |
  本阶段查询 Binance/OKX 的 USDT 报价、USDT 结算永续：成交价格 K 线、持仓量、标记/指数价格、taker 成交流量的区间指标，以及最新成交价与当前持仓量的快照指标。
  perpetual 是永续产品，不是现货；base 是基础币，quote 是报价币，settle 是结算币。
  price.open/close/high/low 是成交价格，不是标记价、指数价或当前实时价格；mark.* 是标记价格、index.* 是指数价格，二者都不是成交价，不可混用。
  trade.volume 是基础币成交量；trade.turnover 是真实报价币成交额，来自 K 线成交额累计，不用最新价估算。
  oi.* 是未平仓合约数量，单位为基础币，不是名义价值或合约张数；Binance 持仓量仅保留最近 30 天，更早的区间会被拒绝。
  taker.* 是交易所官方 5m 周期统计的区间合计：主动买/卖成交量与主动买占比；仅支持 Binance，固定 5m 聚合，没有 interval 和 include_unclosed 参数。
  range_statistic 是实际覆盖区间的统计，time_series 是逐根（逐采样点）的指标序列。
  自然日由 time 和时区定义；滚动窗口不是自然日，也不保证等于交易所官方 24h ticker。
  成交 K 线与标记/指数价格粒度仅支持 5m/15m/1h；持仓量粒度支持 5m/15m/30m/1h/2h/4h/6h/12h/1d；用户未指定则省略，由程序选择。未对齐边界会外延，回答以实际窗口为准。
  默认排除未收盘（未完结）数据点；用户明确要求时才能 include_unclosed=true，并披露状态。
  percent 是百分数（2 表示 2%），ratio 是 0~1 的比例（0.5 表示 50%），两者单位不同，不能直接比较或求差。
  年化仅支持 price.change_pct 的区间收益率路径；mark/index 的 change_pct 和 oi.change_pct 不能进 annualize。
  snapshot 是当前时刻取值（最新成交价、当前持仓量、当前标记价/指数价），带 as_of 数据时间，不带区间、粒度与覆盖状态；"现在/当前"用 snapshot，"昨天/过去 N 天"用 range_statistic，不能互相替换。
  official_24h 是交易所官方滚动 24 小时口径（涨跌幅、成交量、成交额），窗口由交易所定义，不是自然日、也不能与 range_statistic 的窗口混用；"最近 24 小时"若指交易所官方口径才用它，否则按时间窗口取 range_statistic。
  trade.turnover_24h 仅 Binance：OKX 官方无成交额字段，不提供估算值冒充成交额。
  盘口指标只提供买一/卖一/价差/买卖不平衡度：挂单量的单位两所不同（Binance 是基础币、OKX 是合约张数且未换算），
  因此不提供挂单量指标，也不能把两所的挂单量放在一起比较或求和；不平衡度是同一所内部的买卖之比，可以跨所比较。
  funding.rate_settled 只有已结算费率：当前未结算/预测费率两所口径不同（Binance 是最近已结算值、OKX 是预测值），不接入，也不能用已结算费率冒充"当前费率"。
  recent_n 是期数语义（最近 N 期/笔），不是时间区间；count 必须明确给出，样本不足时 sample_complete=false 并披露实际期数，不能当完整样本用。
  结算周期因合约而异（8h/4h 等），结果里带 period_seconds；只有 count=1 的单期费率能年化（basis=periodic_rate、rate_unit=ratio，period 引用同一结果的 period_seconds）。
  历史费率区间序列与累计值暂不支持（变周期口径未核清），也不能用价格涨跌幅冒充费率。
  不支持逐笔明细和现货查询、链上查询，不能替换成已有指标。
operators:
  avg: 等权算术平均；不是加权均值，不把两个不同规模样本的均值再平均称为总体均值。
  sum: 求和；价格序列求和不等于涨跌幅，涨跌幅也不能直接相加当持有期收益。
  min: 返回最小值 value、首个命中位置 index，field 模式返回原始 item（含 time/value）。
  max: 返回最大值 value、首个命中位置 index，field 模式返回原始 item（含 time/value）。
  compare: input={left, right}；relation 为 left 相对 right 的 greater/less/equal，仅判断大小。
  difference: input={left, right}；value=left-right，同输入单位；percent 输入的差为百分点。
  ratio: input={left, right}；right 必须大于0；value=left/right，percent 为乘100后的比例。
  relative_change: input={current, baseline}；baseline 必须大于0；value=(current-baseline)/baseline，percent 已乘100。A比B增长百分之多少，current=A、baseline=B。
  annualize: >
    input 必填 basis、method、rate、rate_unit、period。basis=holding_return|periodic_rate|cumulative_rate，method=simple|compound，不默认方法。
    本阶段行情年化用 price.change_pct 的 range_statistic：basis=holding_return，rate_unit=percent，rate 引用 value，period={value:引用 observation_seconds,unit:second}。
    单期/累计费率尚无取数能力，不用 K 线价格或成交额冒充费率。用户明确给出的周期收益率常量可以计算。
    simple=rate_ratio*(year_days*86400/period_seconds)；compound=(1+rate_ratio)^(year_days*86400/period_seconds)-1。
    cumulative_rate 仅允许 simple；不猜年化方法、不按时间戳自行算时长；year_days 可省略，默认365，可选360/365/366。
    rate_unit=ratio|percent；period.unit=second|minute|hour|day。输出 value 为比例、percent 已乘100，须披露折算假设，不代表未来实际收益。
metrics:
  funding.rate_settled:
    description: 最近 N 期已结算资金费率（小数 ratio，0.0001=0.01%）；按期数取样，样本语义不承诺时间跨度
    unit: ratio
    bindings:
      recent_n: {provider: funding, selector: RATE, count: {min: 1, max: 100}}
  orderbook.best_bid:
    description: 买一价（当前快照，带 as_of）；可指定盘口档位 depth（5-50，默认20）
    unit: quote
    bindings:
      snapshot: {provider: orderbook, selector: BEST_BID, depth: {default: 20, min: 5, max: 50}}
  orderbook.best_ask:
    description: 卖一价（当前快照，带 as_of）；可指定盘口档位 depth（5-50，默认20）
    unit: quote
    bindings:
      snapshot: {provider: orderbook, selector: BEST_ASK, depth: {default: 20, min: 5, max: 50}}
  orderbook.spread:
    description: 买卖一价差（卖一减买一，USDT）；可指定盘口档位 depth（5-50，默认20）
    unit: quote
    bindings:
      snapshot: {provider: orderbook, selector: SPREAD, depth: {default: 20, min: 5, max: 50}}
  orderbook.imbalance:
    description: 买卖盘挂单量不平衡度=买方挂单量/卖方挂单量（0~1 的 ratio，不是百分数）；按实际可用档数计算，最多 10 档
    unit: ratio
    bindings:
      snapshot: {provider: orderbook, selector: IMBALANCE, depth: {default: 20, min: 5, max: 50}}
  price.last:
    description: 最新成交价（当前快照，带 as_of 数据时间）；不是标记价、指数价或区间收盘价
    unit: quote
    bindings:
      snapshot: {provider: ticker, selector: LAST}
  price.change_pct_24h:
    description: 交易所官方滚动 24 小时涨跌幅（百分数口径）；窗口由交易所定义，不是自然日，也不等于区间涨跌幅
    unit: percent
    bindings:
      official_24h: {provider: ticker, selector: CHANGE_PCT_24H}
  price.open:
    description: 区间首根 K 线开盘价；序列为每根开盘价
    unit: quote
    bindings:
      range_statistic: {provider: kline, selector: OPEN, intervals: [5m, 15m, 1h]}
      time_series: {provider: kline, selector: OPEN, intervals: [5m, 15m, 1h]}
  price.close:
    description: 区间末根 K 线收盘价；序列为每根收盘价，不是当前实时价
    unit: quote
    bindings:
      range_statistic: {provider: kline, selector: CLOSE, intervals: [5m, 15m, 1h]}
      time_series: {provider: kline, selector: CLOSE, intervals: [5m, 15m, 1h]}
  price.high:
    description: 区间最高成交价；序列为每根最高价
    unit: quote
    bindings:
      range_statistic: {provider: kline, selector: HIGH, intervals: [5m, 15m, 1h]}
      time_series: {provider: kline, selector: HIGH, intervals: [5m, 15m, 1h]}
  price.low:
    description: 区间最低成交价；序列为每根最低价
    unit: quote
    bindings:
      range_statistic: {provider: kline, selector: LOW, intervals: [5m, 15m, 1h]}
      time_series: {provider: kline, selector: LOW, intervals: [5m, 15m, 1h]}
  price.change_pct:
    description: 区间末收盘价相对首开盘价的涨跌幅，百分数口径
    unit: percent
    bindings:
      range_statistic: {provider: kline, selector: CHANGE_PCT, intervals: [5m, 15m, 1h]}
  trade.volume:
    description: 区间基础币成交量合计；序列为每根 K 线基础币成交量
    unit: base
    bindings:
      range_statistic: {provider: kline, selector: VOLUME, intervals: [5m, 15m, 1h]}
      time_series: {provider: kline, selector: VOLUME, intervals: [5m, 15m, 1h]}
  trade.turnover:
    description: 区间报价币成交额合计；暂不提供逐根成交额序列
    unit: quote
    bindings:
      range_statistic: {provider: kline, selector: TURNOVER, intervals: [5m, 15m, 1h]}
  trade.volume_24h:
    description: 交易所官方滚动 24 小时成交量（基础币）；不是自然日成交量
    unit: base
    bindings:
      official_24h: {provider: ticker, selector: VOLUME_24H}
  trade.turnover_24h:
    description: 交易所官方滚动 24 小时成交额（USDT逐笔汇总）；仅 Binance，OKX 官方不提供成交额字段
    unit: quote
    bindings:
      official_24h: {provider: ticker, selector: TURNOVER_24H, exchanges: [binance]}
  oi.quantity:
    description: 未平仓合约数量（基础币口径，不是名义价值或张数）；序列为每个采样点的持仓量，快照为当前持仓量；Binance 仅保留最近 30 天
    unit: base
    bindings:
      snapshot: {provider: oi, selector: QUANTITY}
      time_series: {provider: oi, selector: QUANTITY, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  oi.start:
    description: 区间期初未平仓合约数量（基础币）
    unit: base
    bindings:
      range_statistic: {provider: oi, selector: START, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  oi.end:
    description: 区间期末未平仓合约数量（基础币）
    unit: base
    bindings:
      range_statistic: {provider: oi, selector: END, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  oi.change:
    description: 区间未平仓合约数量变化量（基础币）
    unit: base
    bindings:
      range_statistic: {provider: oi, selector: CHANGE, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  oi.change_pct:
    description: 区间未平仓合约数量变化率，百分数口径；不能用于年化
    unit: percent
    bindings:
      range_statistic: {provider: oi, selector: CHANGE_PCT, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  oi.max:
    description: 区间采样点最高未平仓合约数量（基础币）
    unit: base
    bindings:
      range_statistic: {provider: oi, selector: MAX, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  oi.min:
    description: 区间采样点最低未平仓合约数量（基础币）
    unit: base
    bindings:
      range_statistic: {provider: oi, selector: MIN, intervals: [5m, 15m, 30m, 1h, 2h, 4h, 6h, 12h, 1d]}
  mark.price:
    description: 当前标记价格（快照，带 as_of）；不是成交价、指数价
    unit: quote
    bindings:
      snapshot: {provider: mark_price, selector: MARK}
  mark.open:
    description: 区间首根标记价格开盘价；序列为每根开盘价；标记价不是成交价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: MARK_OPEN, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: MARK_OPEN, intervals: [5m, 15m, 1h]}
  mark.close:
    description: 区间末根标记价格收盘价；序列为每根收盘价，不是当前实时价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: MARK_CLOSE, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: MARK_CLOSE, intervals: [5m, 15m, 1h]}
  mark.high:
    description: 区间最高标记价格；序列为每根最高价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: MARK_HIGH, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: MARK_HIGH, intervals: [5m, 15m, 1h]}
  mark.low:
    description: 区间最低标记价格；序列为每根最低价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: MARK_LOW, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: MARK_LOW, intervals: [5m, 15m, 1h]}
  mark.change_pct:
    description: 区间标记价格末收盘价相对首开盘价的涨跌幅，百分数口径；不能用于年化
    unit: percent
    bindings:
      range_statistic: {provider: mark_price, selector: MARK_CHANGE_PCT, intervals: [5m, 15m, 1h]}
  index.price:
    description: 当前指数价格（快照，带 as_of）；是现货指数加权价，不是成交价、标记价
    unit: quote
    bindings:
      snapshot: {provider: mark_price, selector: INDEX}
  index.open:
    description: 区间首根指数价格开盘价；序列为每根开盘价；指数价不是成交价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: INDEX_OPEN, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: INDEX_OPEN, intervals: [5m, 15m, 1h]}
  index.close:
    description: 区间末根指数价格收盘价；序列为每根收盘价，不是当前实时价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: INDEX_CLOSE, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: INDEX_CLOSE, intervals: [5m, 15m, 1h]}
  index.high:
    description: 区间最高指数价格；序列为每根最高价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: INDEX_HIGH, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: INDEX_HIGH, intervals: [5m, 15m, 1h]}
  index.low:
    description: 区间最低指数价格；序列为每根最低价
    unit: quote
    bindings:
      range_statistic: {provider: mark_price, selector: INDEX_LOW, intervals: [5m, 15m, 1h]}
      time_series: {provider: mark_price, selector: INDEX_LOW, intervals: [5m, 15m, 1h]}
  index.change_pct:
    description: 区间指数价格末收盘价相对首开盘价的涨跌幅，百分数口径；不能用于年化
    unit: percent
    bindings:
      range_statistic: {provider: mark_price, selector: INDEX_CHANGE_PCT, intervals: [5m, 15m, 1h]}
  taker.buy_volume:
    description: 区间主动买成交量合计（基础币）；交易所官方 5m 统计求和，固定粒度无 interval 参数，仅 Binance
    unit: base
    bindings:
      range_statistic: {provider: taker, selector: BUY_VOLUME, exchanges: [binance]}
  taker.sell_volume:
    description: 区间主动卖成交量合计（基础币）；交易所官方 5m 统计求和，固定粒度无 interval 参数，仅 Binance
    unit: base
    bindings:
      range_statistic: {provider: taker, selector: SELL_VOLUME, exchanges: [binance]}
  taker.buy_ratio:
    description: 区间主动买成交量占总成交量的比例（0~1 的 ratio，不是百分数）；仅 Binance
    unit: ratio
    bindings:
      range_statistic: {provider: taker, selector: BUY_RATIO, exchanges: [binance]}
