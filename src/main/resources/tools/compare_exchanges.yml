name: compare_exchanges
# 暂缓：聚合指标类 tool 待重新设计（见 CompareExchangesTool.java 顶部注释），恢复时改回 true
enabled: false
description: 对比 Binance 与 OKX 同币种、同窗口的涨跌幅及背离指标；不比较资金费率或持仓量。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 并行对比 Binance 与 OKX 同一币种在同一窗口的价格涨跌幅
  - 给出两所涨跌幅差值（diff_percentage_points，单位百分点）与是否背离
  - 一所数据获取失败或窗口内无 K 线时，该侧标注原因，另一所结果仍保留
limitations:
  - 只对比价格变化，不对比资金费率、持仓量、盘口等其他指标
  - significant 仅表示 diff 超过固定阈值 0.3 个百分点（业务阈值命中），不是统计显著性检验
  - 只支持 1h / 4h / 24h 三档相对窗口，无法对比指定的历史时间段
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [symbol]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    window:
      type: string
      enum: [1h, 4h, 24h]
      default: 1h
      description: 从当前向前的时间窗口
