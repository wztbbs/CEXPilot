name: get_klines
enabled: true
description: 查询最近指定窗口的K线及已计算的涨跌幅、最高价、最低价；不支持指定历史起止时间。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 获取最近 1h / 4h / 24h 窗口的K线序列（开高低收量）
  - 直接给出窗口内已计算的涨跌幅、最高价、最低价
  - 提供数据新鲜度判断（最后一根K线距当前的时长）
limitations:
  - 只支持 1h / 4h / 24h 三档相对窗口，永远从当前时刻往前取
  - 无法查询指定的历史起止时间（如昨天下午 3 点到 5 点）
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      default: okx
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    window:
      type: string
      enum: [1h, 4h, 24h]
      default: 1h
      description: 从当前向前的时间窗口
