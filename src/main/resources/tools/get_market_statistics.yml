name: get_market_statistics
enabled: true
description: >
  查询指定时间范围的区间统计：区间开盘价、收盘价、最高价、最低价、涨跌幅、成交量合计和成交额合计（USDT）。
  不返回逐根 K 线明细；需要明细请用 get_klines。
  本工具只计算单个交易所、单个币种、单个区间的上述指标，不产出不同查询结果之间的差值、比值、大小比较或排名。
  时间范围用 time 对象表达，4 种结构选其一（与 get_klines 相同）：
  1) 自然周期，如昨天/上周/昨天下午：
     {"type":"calendar_period","timezone":null,"unit":"day|week|month|quarter|year","offset":-1,
      "segment":"full|early_morning|morning|afternoon|evening","extent":"full_period|to_request_time"}
     offset 相对当前周期（0=本周期,-1=上一周期）；非 full 的 segment 仅允许 unit=day；
     extent=to_request_time 表示“本周期起点至现在”（如本月至今），仅允许 offset=0 且 segment=full。
  2) 滚动窗口，如过去 6 小时：{"type":"rolling_window","timezone":null,"duration":{"value":6,"unit":"second|minute|hour|day|week"}}，
     结束时间固定为当前时刻，不按整点取整。
  3) 相对日期时段，如昨天 15 点到 17 点：
     {"type":"relative_day_range","timezone":null,"start":{"day_offset":-1,"time":"15:00:00"},"end":{"day_offset":-1,"time":"17:00:00"}}，
     day_offset 相对今天（-1=昨天,0=今天），跨天需显式加大 end 的 day_offset。
  4) 明确日期范围，如 9 月 1 日到 9 月 3 日：
     {"type":"absolute_range","timezone":null,"start":{"year":null,"month":9,"day":1,"time":null},
      "end":{"year":null,"month":9,"day":3,"time":null},"end_mode":"inclusive_date|exclusive"}，
     year 可省略（按最近一次该日期消解）；end_mode=inclusive_date 表示包含结束日期整天（仅允许 end.time=null）。
  timezone 均为 IANA 时区（如 Asia/Shanghai），填 null 表示继承请求时区（当前为 UTC+8）。
  interval 仅在用户明确指定 K 线粒度时填写；未指定时省略，由程序自动选择，不得自行猜测粒度。
  区间起止未对齐粒度边界时自动外延覆盖，并以 requested_range/effective_range 标注实际区间。
  返回的 coverage 必须检查：range_complete=true 才表示请求区间被完整覆盖，仅在此时输出 statistics；
  range_complete=false（部分覆盖/缺口/区间终点未到）时不输出 statistics（statistics_omitted 注明原因），不得凭部分数据自行编造区间指标；
  如需「本周期截至现在」的统计，应使用 extent=to_request_time 表达（此时终点通常不对齐粒度边界，会自动外延覆盖）。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 按 TimeSpec 计算区间统计：自然周期、滚动窗口、相对日期时段、明确日期范围
  - 区间完整覆盖（range_complete=true）时输出 statistics，并标注实际计算范围 actual_range
  - 返回覆盖核对结果 coverage（range_complete/closed_part_complete/covered_until、缺失与错位的开盘时间、未收盘状态）
limitations:
  - 粒度仅支持 5m / 15m / 1h；单次查询上限 6000 根（5m 约 20 天，15m 约 62 天，1h 约 250 天）
  - 默认剔除未收盘的 K 线并标注 dropped_unclosed；include_unclosed=true 时保留并标注 contains_unclosed
  - 区间未完整覆盖（range_complete=false）时不输出 statistics
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol, time]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    interval:
      type: string
      enum: [5m, 15m, 1h]
      description: 用户明确指定的 K 线粒度；未指定时省略，由程序自动选择
    time:
      type: object
      description: 时间范围（TimeSpec），4 种 type 结构见工具描述，字段严格校验由服务端执行
    include_unclosed:
      type: boolean
      default: false
      description: 是否包含尚未收盘的 K 线；false 时剔除并标注 dropped_unclosed
