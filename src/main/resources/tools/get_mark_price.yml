name: get_mark_price
enabled: true
description: 查询标记价、现货指数价及基差（标记价减指数价）；资金费率请用 get_funding_rate。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询永续合约标记价格与现货指数价格
  - 给出已计算的基差（标记价 - 指数价），判断合约溢价程度
limitations:
  - 资金费率字段仅 Binance 返回（OKX 的 mark-price 接口不含费率），查资金费率请用 get_funding_rate
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
