name: get_mark_price_statistics
enabled: true
description: >
  计算指定时间范围的标记价格或指数价格区间统计：区间涨跌幅、最高价和最低价（价格 K 线不含成交量指标），
  不返回逐根明细，需要明细请用 get_mark_price_history。price_type：mark=标记价格（默认），index=指数价格。
  本工具只计算单个交易所、单个币种、单个区间的上述指标，不产出不同查询结果之间的差值、比值、大小比较或排名。
  时间范围用 time 对象表达（必填），4 种结构选其一：
  1) 自然周期，如昨天/上周：{"type":"calendar_period","timezone":null,"unit":"day|week|month|quarter|year","offset":-1,
     "segment":"full|early_morning|morning|afternoon|evening","extent":"full_period|to_request_time"}，
     offset 相对当前周期（0=本周期,-1=上一周期）；非 full 的 segment 仅允许 unit=day；
     extent=to_request_time 表示“本周期起点至现在”，仅允许 offset=0 且 segment=full。
  2) 滚动窗口，如过去 6 小时：{"type":"rolling_window","timezone":null,"duration":{"value":6,"unit":"second|minute|hour|day|week"}}，
     结束时间固定为当前时刻。
  3) 相对日期时段，如昨天 15 点到 17 点：{"type":"relative_day_range","timezone":null,
     "start":{"day_offset":-1,"time":"15:00:00"},"end":{"day_offset":-1,"time":"17:00:00"}}。
  4) 明确日期范围，如 9 月 1 日到 9 月 3 日：{"type":"absolute_range","timezone":null,
     "start":{"year":null,"month":9,"day":1,"time":null},"end":{"year":null,"month":9,"day":3,"time":null},
     "end_mode":"inclusive_date|exclusive"}。
  timezone 均为 IANA 时区，填 null 表示继承请求时区（当前为 UTC+8）。
  interval 仅在用户明确指定 K 线粒度时填写；未指定时省略，由程序自动选择，不得自行猜测粒度。
  区间起止未对齐粒度边界时自动外延覆盖，并以 requested_range/effective_range 标注实际区间。
  返回的 coverage 必须检查：range_complete=true 才表示请求区间被完整覆盖，仅在此时输出 statistics；
  range_complete=false（部分覆盖/缺口/区间终点未到）时不输出 statistics（statistics_omitted 注明原因），不得凭部分数据自行编造统计指标；
  如需「本周期截至现在」的统计，应使用 extent=to_request_time 表达（此时终点通常不对齐粒度边界，会自动外延覆盖）。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 按 TimeSpec 计算标记/指数价格区间统计：涨跌幅、最高价、最低价
  - 区间完整覆盖（range_complete=true）时输出 statistics，并标注实际计算范围 actual_range
  - 返回覆盖核对结果 coverage
limitations:
  - 粒度仅支持 5m / 15m / 1h；单次查询上限 6000 根
  - 价格 K 线不含成交量指标（接口本身不提供）
  - 区间未完整覆盖（range_complete=false）时不输出 statistics
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol, time]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    price_type:
      type: string
      enum: [mark, index]
      default: mark
      description: mark=标记价格，index=指数价格
    interval:
      type: string
      enum: [5m, 15m, 1h]
      description: 用户明确指定的 K 线粒度；未指定时省略，由程序自动选择
    time:
      type: object
      description: 时间范围（TimeSpec），4 种 type 结构见工具描述，字段严格校验由服务端执行
    include_unclosed:
      type: boolean
      default: false
      description: 是否包含尚未收盘的 K 线；false 时剔除并标注 dropped_unclosed
