name: get_open_interest
enabled: true
description: 查询指定 USDT 永续合约的当前持仓量（当前快照）：持仓数量、单位（基础币）、数据时间和快照采集时间。历史序列用 get_open_interest_history，区间统计用 get_open_interest_statistics。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询当前持仓数量（真快照接口，非历史末点）
  - 明确单位（基础币）与数据时间
limitations:
  - 持仓量是未平仓合约数量，不是货币名义价值
  - 不提供历史序列与变化统计（分别走 get_open_interest_history / get_open_interest_statistics）
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
