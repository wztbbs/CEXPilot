name: get_open_interest
enabled: true
description: 查询当前持仓量（基础币）、近24小时历史及变化百分比；窗口固定，OKX历史为全市场SWAP汇总口径。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询永续合约当前持仓量（以基础币计）
  - 给出近 24 小时持仓量历史序列与已计算的 24 小时变化百分比
limitations:
  - 历史固定为近 24 小时（1 小时间隔），不支持自定义时间窗口
  - OKX 的历史序列是该币种全市场 SWAP 汇总口径，与当前值的单合约口径不完全一致
  - 单独无法判断多空方向，需结合价格与资金费率
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      default: okx
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
