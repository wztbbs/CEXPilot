name: get_open_interest
enabled: true
description: 查询持仓量（USD 名义值）。open_interest 当前值取近24小时历史序列（1 小时粒度）的最新点，oi_change_24h_pct 为序列算出的 24 小时变化率，二者同口径。OKX 序列为该币种全市场合约汇总，币安为该永续合约。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询永续合约当前持仓量（USD 名义值）
  - 给出近 24 小时持仓量历史序列与已计算的 24 小时变化百分比
limitations:
  - 历史固定为近 24 小时（1 小时间隔），不支持自定义时间窗口
  - 当前值取序列最新点，比实时值最多旧 1 小时
  - 单独无法判断多空方向，需结合价格与资金费率
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
