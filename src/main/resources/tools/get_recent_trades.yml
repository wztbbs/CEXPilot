name: get_recent_trades
enabled: true
description: >
  获取最近逐笔成交记录，并返回已计算的主动买入占比
  （buy_volume_ratio 接近 1 说明买方主动性强）。用于判断短期多空力量
capabilities:
  - 获取最近逐笔成交记录（时间、价格、数量、主动方向）
  - 给出已计算的成交笔数、主动买入笔数与主动买入量占比
limitations:
  - 最多取最近 100 笔，成交密集时覆盖的时间跨度可能只有几分钟
  - 成交明细最多返回 20 条
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      description: 交易所
    symbol:
      type: string
      description: 币种基础代码，如 BTC / ETH
    limit:
      type: integer
      description: 成交条数，默认 50，最大 100
