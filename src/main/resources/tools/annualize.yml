name: annualize
enabled: true
description: >
  将一个明确周期内的费率或收益率折算为年化值；不预测未来收益，不推断持仓方向，也不查询数据。
  input 必填 basis、method、rate、rate_unit、period，可选 year_days。
  basis 必须明确选择：periodic_rate=单期费率/收益率外推（重复相同周期和费率）；
  cumulative_rate=完整历史窗口内费率直接求和；holding_return=整个持有期总收益率（如期末价/期初价-1，不是各期收益率直接求和）。
  method 必须明确选择 simple 或 compound，没有默认值；
  simple 公式 rate_ratio * (year_days*86400/period_seconds)，不计复投；
  compound 公式 (1+rate_ratio)^(year_days*86400/period_seconds)-1，假设复投/几何折算。
  cumulative_rate 只允许 simple；不能把历史费率之和当复合收益率输入 compound，不能为绕过校验改 basis。
  单期资金费率可按用户明确要求做 compound 假设计算，但不能称为实际可实现的复利收益。
  rate 是 JSON number 或无单位的十进制字符串，也可完整引用上游字段；rate_unit 必须为 ratio 或 percent：
  ratio 的 0.0001 表示 0.01%；percent 的 0.01 也表示 0.01%，不要由模型先乘除 100。
  period 结构 {"value":正数或完整引用,"unit":"second|minute|hour|day"}；表示 rate 对应的整个观测时长，
  不支持含义不固定的 month/year；时长由上游事实或用户明确给出的周期提供，不猜默认 8 小时、不按时间戳自行计算。
  year_days 是整数 360/365/366，省略时由代码默认 365；固定日数年基准，不自动按闰年或交易日换算，输出会标注基准及来源。
  输入缺少对象、观察范围、方法或无法确定周期时先反问用户；不能仅因需要补充口径就声称没有年化能力。
  本阶段只有成交价格区间涨跌幅是可年化的取数路径：资金费率、标记价涨跌幅、持仓量变化率都没有可用的周期 fact，不能冒充费率年化。
  示例1：历史价格区间涨跌幅做复利年化，先查 price.change_pct 的 range_statistic，再 input={"basis":"holding_return",
  "method":"compound","rate":"{{m1.binance.value}}","rate_unit":"percent","period":{"value":"{{m1.binance.observation_seconds}}","unit":"second"}}。
  示例2：同一结果做简单年化，只改 method=simple，rate 与 period 引用不变。
  observation_seconds 是实际参与统计的时长，不能用请求窗口长度或 samples 首末点之差替代。
  不能把成交额、成交量或金额当收益率；用户给出的周期收益率常量可以写常量。
  行情数值必须引用本轮指标事实，常量仅限用户明确给定或 year_days 的公开默认值。
  输出 value 是年化小数比例，percent 是已乘100的百分数值，均为十进制字符串；展示百分比只给 percent 加 %。
  同时输出 basis、method、input_rate、input_rate_unit、rate_ratio、period_seconds、year_days、year_days_source、annual_factor、formula 和计算假设。
  负费率保留正负号；资金费率正数仍表示多头付费给空头，不自动转成多头收益。
  复利或 holding_return 输入不得小于 -100%；恰好 -100% 的复利结果仍为 -100%；simple 累计费率可低于 -100%。
  时长限制为1秒至365250天；输入遵守公共数值限制（100位有效数字，scale绝对值不超过1000），复利年化对数增长绝对值不得超过200。
  使用十进制 BigDecimal 运算，复利使用高精度 log/exp，结果按34位有效数字 HALF_EVEN 舍入。
  DAG 拦截标明不完整或省略统计的引用源；计算失败后不允许模型换公式补算。数值校验不能证明输入的业务口径正确。
input_schema:
  type: object
  additionalProperties: false
  required: [input]
  properties:
    input:
      type: object
      description: basis、method、rate、rate_unit、period 必填，year_days 可选；方法和口径无默认值，结构见描述

# ToolResult.data 的字段结构；条件字段允许缺失，实际可用性在执行时检查。
output_schema:
  type: "object"
  additionalProperties: false
  properties:
    value: {"type": "string", "description": "ratio 年化值"}
    percent: {"type": "string", "description": "percent 年化值"}
    value_unit: {"type": "string"}
    basis: {"type": "string"}
    method: {"type": "string"}
    input_rate: {"type": "string"}
    input_rate_unit: {"type": "string"}
    rate_ratio: {"type": "string"}
    period_seconds: {"type": "string"}
    year_days_source: {"type": "string"}
    annual_factor: {"type": "string"}
    formula: {"type": "string"}
    interpretation: {"type": "string"}
    assumption: {"type": "string"}
    year_days: {"type": "integer"}
    # 指标 DAG 执行时附加；独立调用算子时可不存在。
    unit: {"type": "string", "description": "由程序继承或推导的结果单位"}
    metric_sources:
      type: array
      description: 去重后的指标来源、窗口和质量信息，由执行器维护
      items:
        type: object
        additionalProperties: true
        properties: {}
