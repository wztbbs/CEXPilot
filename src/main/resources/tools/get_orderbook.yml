name: get_orderbook
enabled: true
description: 查询当前盘口前10档、买卖盘不平衡度及价差；不提供历史盘口，不能解释过去的价格变化。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 获取当前盘口买卖各档位价格与挂单量（输出前 10 档）
  - 给出已计算的买卖盘不平衡度与买一卖一价差
limitations:
  - 只是当前时刻快照，不能解释过去的价格变化
  - 无论请求多深，输出最多买卖各 10 档
  - 数量单位两所不同：OKX 是合约张数（quantity_contracts），Binance 是基础币；输出列名与 quantity_unit 标注
  - 不平衡度按实际可用档数计算，字段名为 imbalance_topN（N 为实际档数，不足 10 档时 N < 10），并附 bid_levels / ask_levels
  - Binance 只接受 5/10/20/50 档，其余 depth 会映射到最近的合法档位，输出 depth 为实际请求档位
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    depth:
      type: integer
      default: 20
      minimum: 5
      maximum: 50
      description: 请求盘口档位数

# ToolResult.data 的字段结构；条件字段允许缺失，实际可用性在执行时检查。
output_schema:
  type: "object"
  additionalProperties: false
  properties:
    exchange: {"type": "string"}
    symbol: {"type": "string"}
    depth: {"type": "integer"}
    requested_depth: {"type": "integer"}
    bid_levels: {"type": "integer"}
    ask_levels: {"type": "integer"}
    as_of_utc8: {"type": "string"}
    quantity_unit: {"type": "string"}
    best_bid: {"type": "number"}
    best_ask: {"type": "number"}
    spread: {"type": "number"}
    imbalance_top1: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top2: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top3: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top4: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top5: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top6: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top7: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top8: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top9: {"type": "number", "description": "仅对应实际档数的字段存在"}
    imbalance_top10: {"type": "number", "description": "仅对应实际档数的字段存在"}
    bids_columns:
      type: "array"
      items: {"type": "string"}
    asks_columns:
      type: "array"
      items: {"type": "string"}
    bids:
      type: "array"
      items:
        type: "array"
        prefixItems:
          - {"type": "number", "description": "price_usdt"}
          - {"type": "number", "description": "数量，单位见 quantity_unit"}
        items: false
    asks:
      type: "array"
      items:
        type: "array"
        prefixItems:
          - {"type": "number", "description": "price_usdt"}
          - {"type": "number", "description": "数量，单位见 quantity_unit"}
        items: false
