name: get_orderbook
enabled: true
description: 查询当前盘口前10档、买卖盘不平衡度及价差；不提供历史盘口，不能解释过去的价格变化。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 获取当前盘口买卖各档位价格与挂单量（输出前 10 档）
  - 给出已计算的前 10 档买卖盘不平衡度与买一卖一价差
limitations:
  - 只是当前时刻快照，不能解释过去的价格变化
  - 无论请求多深，输出最多买卖各 10 档
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    depth:
      type: integer
      default: 20
      minimum: 5
      maximum: 50
      description: 请求盘口档位数
