name: get_ticker
enabled: true
description: 查询最新成交价及滚动24小时涨跌幅、成交量（基础币）、成交额（USDT）；滚动24小时不等于当天零点至今；OKX 无官方成交额字段，其成交额为估算值（24h成交量×最新价），不能当作精确成交额使用。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询永续合约最新成交价
  - 查询交易所官方滚动 24 小时涨跌幅与成交量（含 USDT 计价成交额）
limitations:
  - 涨跌幅是交易所官方滚动 24 小时口径，与按自然日/指定区间的 K 线涨跌幅可能略有差异
  - OKX 不提供成交额字段，turnover_24h_usdt 为估算值（24h 基础币成交量 × 最新价），输出带 turnover_24h_usdt_estimated 标志；Binance 为接口原值
  - 基准价（open24h）为 0 时 change_pct_24h 为 null 并附原因，不代表涨跌 0%
  - 只反映当前时刻与近 24 小时，无法回答更长时间范围的问题
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH

# ToolResult.data 的字段结构；条件字段允许缺失，实际可用性在执行时检查。
output_schema:
  type: "object"
  additionalProperties: false
  properties:
    exchange: {"type": "string"}
    symbol: {"type": "string"}
    last_price: {"type": "number", "description": "最新成交价 USDT；直接位于 data 下"}
    change_pct_24h:
      type: ["number", "null"]
      description: "percent；滚动24h涨跌幅"
    volume_24h_base: {"type": "number"}
    turnover_24h_usdt: {"type": "number"}
    turnover_24h_usdt_estimated: {"type": "boolean"}
    change_pct_24h_note: {"type": "string"}
    as_of_utc8: {"type": "string"}
    units:
      type: "object"
      additionalProperties: false
      properties:
        volume_24h_base: {"type": "string"}
        turnover_24h_usdt: {"type": "string"}
