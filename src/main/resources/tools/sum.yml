name: sum
enabled: true
description: >
  对一个非空数值集合精确求和。可以合计两个或多个查询结果，或对序列中指定字段求累计。
  input 恰好使用以下一种结构：
  1) 数值集合：{"kind":"values","values":["{{n1.data.value}}","{{n2.data.value}}"]}；两个数 a、b 就写 values=[a,b]，
     也可以把 values 整体引用为上游数值数组。
  2) 对象集合：{"kind":"field","collection":"{{n1.data.items}}","field":"price"}；field 是直接字段名，不支持嵌套路径。
  3) 表格列：{"kind":"field","collection":"{{n1.data.rates}}","columns":"{{n1.data.rates_columns}}","field":"rate"}；
     现有历史工具多返回二维数组及对应 *_columns，必须同时引用列名数组，按真实列名选择，不能猜下标或把整行当数字。
  数值允许 JSON number 或无单位的十进制字符串（包括科学计数法）；不接受百分号、千位分隔符、算术表达式、布尔值或 null。
  输出 value 为十进制字符串、count 为实际参与元素数、method=arithmetic_sum；value 与输入同单位、同比例口径。
  使用 BigDecimal 逐项精确相加，无舍入。集合最多 10000 项；单值最多 100 位有效数字，scale 绝对值不超过 1000。
  空集合、字段缺失、null、非数值、重复列名、表格行列长度不符都失败，不跳过元素、不填零、不展开嵌套集合。
  适用示例：币安与 OKX 昨天成交额合计（kind=values 引用两侧 statistics.quote_volume）；最近 10 期已结算资金费率累计
  （get_funding_rate_history → 表格 rate 列求和，注意资金费率历史工具的统计输出可能已有 sum 字段，已有统计优先直接使用）；
  多笔成交的成交额合计。
  不适用：求平均（用 avg）、差值（用 difference）、占比分母的"合计"若需向用户披露应单独说明口径；不对不同单位或不同窗口的数值求和。
  只能对用户指定且口径可比的数据求和；不混合单位，不把部分区间的求和称为完整区间总量。
  行情值必须引用本轮查询结果，不能抄写、猜测或预先计算；只有用户明确提供的数值可以写常量，所有引用必须声明 depends_on。
  DAG 会拒绝标明 coverage.range_complete=false、sample_complete=false、complete=false 或 statistics_omitted 的引用源；
  不得为了绕过完整性检查把不完整来源改写为常量。
input_schema:
  type: object
  additionalProperties: false
  required: [input]
  properties:
    input:
      type: object
      description: 输入选择对象，kind=values 或 field；完整结构和边界见工具描述，嵌套结构由算子严格校验
