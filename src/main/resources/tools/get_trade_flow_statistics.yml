name: get_trade_flow_statistics
enabled: true
description: >
  查询指定时间区间的主动买/卖成交量（基础币）及主动买占比，数据来自交易所官方 taker 统计接口
  （binance=takerlongshortRatio，okx=taker-volume-contract），按 5m 周期序列聚合计总。
  不提供成交额（USDT）与成交笔数：成交额统计请用 get_market_statistics，逐笔明细请用 get_trade_history。
  本工具只计算单个交易所、单个币种、单个区间的上述指标，不产出不同查询结果之间的差值、比值、大小比较或排名。
  时间范围用 time 对象表达（必填），4 种结构选其一：
  1) 自然周期，如昨天/上周：{"type":"calendar_period","timezone":null,"unit":"day|week|month|quarter|year","offset":-1,
     "segment":"full|early_morning|morning|afternoon|evening","extent":"full_period|to_request_time"}。
  2) 滚动窗口，如过去 30 分钟：{"type":"rolling_window","timezone":null,"duration":{"value":30,"unit":"second|minute|hour|day|week"}}。
  3) 相对日期时段，如昨天 15 点到 17 点：{"type":"relative_day_range","timezone":null,
     "start":{"day_offset":-1,"time":"15:00:00"},"end":{"day_offset":-1,"time":"17:00:00"}}。
  4) 明确日期范围：{"type":"absolute_range","timezone":null,"start":{"year":null,"month":9,"day":1,"time":null},
     "end":{"year":null,"month":9,"day":3,"time":null},"end_mode":"inclusive_date|exclusive"}。
  timezone 均为 IANA 时区，填 null 表示继承请求时区（当前为 UTC+8）。
  区间起止未对齐 5m 边界时自动外延覆盖，并以 requested_range/effective_range 标注实际区间；
  当前未完结的 5m 周期不计入统计（coverage.dropped_unclosed 标注）。
  返回的 coverage 必须检查：range_complete=true 才表示请求区间被完整覆盖，仅在此时输出 statistics；
  range_complete=false（部分覆盖/缺口/区间终点未到）时不输出 statistics（statistics_omitted 注明原因），不得凭部分数据自行估算区间流量。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 按 TimeSpec 计算区间主动买/卖成交量（基础币）及主动买占比
  - 区间完整覆盖（range_complete=true）时输出 statistics，并标注实际计算范围 actual_range
  - 返回覆盖核对结果 coverage
limitations:
  - 数据来自交易所官方 5m taker 统计接口，最新数据有数分钟发布延迟；当前未完结周期不计入
  - 币安只保留最近约 30 天历史；OKX 历史保留期按保守 30 天处理
  - 不提供成交额与成交笔数（成交额用 get_market_statistics）
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol, time]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
    time:
      type: object
      description: 时间范围（TimeSpec），4 种 type 结构见工具描述，字段严格校验由服务端执行
