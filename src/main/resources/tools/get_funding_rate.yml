name: get_funding_rate
enabled: true
description: 查询当前资金费率、下次结算时间、最近10期费率及趋势。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询当前资金费率（同时给出小数与百分比两种形式）与下次结算时间
  - 给出最近 10 期历史费率序列与已计算的趋势（rising / falling / flat）
limitations:
  - 历史只有最近 10 期，无法分析更长周期的费率变化
  - 资金费率是情绪指标，不能单独用来预测价格方向
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
