name: get_funding_rate
enabled: true
description: 查询当前资金费率及其状态、对应结算时间、下一次结算时间（当前快照）。OKX 当前费率是预测值（current_rate_kind=predicted，到结算才确定），Binance 当前费率取历史末条已结算值（current_rate_kind=settled）；快照采集时间与结算时间分开输出。历史费率序列用 get_funding_rate_history，区间统计用 get_funding_rate_statistics。
# capabilities / limitations / scope 仅作维护文档；重要限制须写入 description。
capabilities:
  - 查询当前资金费率（同时给出小数与百分比两种形式）
  - 给出当前费率对应的结算时间、下一次结算时间（OKX 另有再下一期）
limitations:
  - 两所费率口径不同：OKX 当前费率是预测值，Binance 是最近一期已结算值，以 current_rate_kind 为准
  - next_funding_time 一律为下一次结算；OKX 另有 following_funding_time 表示再下一期（Binance 不提供）
  - snapshot_time 是快照采集时间，与费率结算时间含义不同
  - 资金费率是情绪指标，不能单独用来预测价格方向
scope:
  exchanges: [binance, okx]
  market_type: perpetual
input_schema:
  type: object
  additionalProperties: false
  required: [exchange, symbol]
  properties:
    quote_asset:
      type: string
      default: USDT
      description: 用户指定的计价币，原样保留；未指定时使用 USDT，不支持的值由工具拒绝
    market_type:
      type: string
      default: perpetual
      description: 用户指定的市场（spot/perpetual/delivery 等），原样保留；未指定时使用 perpetual，不支持的值由工具拒绝
    exchange:
      type: string
      enum: [binance, okx]
      default: binance
      description: 交易所
    symbol:
      type: string
      description: 基础币代码，如 BTC / ETH
