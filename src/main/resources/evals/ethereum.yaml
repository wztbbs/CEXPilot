# 交易哈希均为以太坊主网真实交易（2026 年 9 月抓取）：
# - usdt-transfer: USDT 转账，含 Transfer 事件
# - swap: Uniswap 路由 Swap
# - failed-tx: 执行失败但扣 Gas
# - plain-eth-transfer: 普通 ETH 转账
cases:
  - id: eth-transfer-001
    question: "分析这笔交易做了什么：0xabad7bc4a2320b6ae713d9c4694540f3c47a4fb5a6bb64e3ccd7d5a16c4224a6"
    expected_tools: [get_transaction]
    forbidden_tools: [get_klines, get_ticker]
    required_evidence_keys: [status, fund_flow]
  - id: eth-transfer-002
    question: "0xb0a384ed5a7fa0ba07cbf5508115e04f869b5d894558dd86fc8742d5469abbda 这笔交易的钱去了哪里？"
    expected_tools: [get_transaction]
    forbidden_tools: [get_klines]
    required_evidence_keys: [status, value_eth]
  - id: eth-swap-001
    question: "帮我看看这笔交易：0xcd3565946f32d57ce8a05a13e164c6728cafe71c3c93849044b048af22b9f826"
    expected_tools: [get_transaction]
    forbidden_tools: [get_klines]
    required_evidence_keys: [status, events]
  - id: eth-failed-001
    question: "这笔交易为什么失败了还扣 Gas？0x20d24607a2f465c31167ac346622692f9c6fde5bd604cb40cf6131b6b97d2705"
    expected_tools: [get_transaction]
    forbidden_tools: [get_klines]
    required_evidence_keys: [status, total_fee_eth, failure_note]
  - id: eth-followup-001
    question: "这笔交易里有没有 Approval？有没有风险？"
    setup_questions:
      - "分析这笔交易做了什么：0xabad7bc4a2320b6ae713d9c4694540f3c47a4fb5a6bb64e3ccd7d5a16c4224a6"
    expected_tools: []
    forbidden_tools: [get_klines]
    required_evidence_keys: []
