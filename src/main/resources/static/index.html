<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEXPilot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #f7f7f8;
    color: #1f1f1f;
    display: flex;
    flex-direction: column;
  }

  /* ── 初始态：输入框居中 ───────────────────── */
  #app {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
  }
  #app.empty { justify-content: center; }

  #hero { display: none; text-align: center; margin-bottom: 28px; }
  #app.empty #hero { display: block; }
  #hero h1 { font-size: 32px; font-weight: 600; letter-spacing: 1px; }
  #hero p { margin-top: 10px; color: #8a8a8a; font-size: 14px; }

  /* ── 对话区 ─────────────────────────────── */
  #messages {
    display: none;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    padding: 32px 0 24px;
  }
  #app.chatting #messages { display: block; }

  .msg { margin-bottom: 28px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: #1f1f1f;
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    padding: 12px 18px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.6;
  }
  .msg.assistant .bubble {
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.assistant .meta {
    margin-top: 8px;
    font-size: 12px;
    color: #9a9a9a;
  }
  .msg.assistant .meta a { color: #9a9a9a; text-decoration: none; border-bottom: 1px dotted #c5c5c5; }
  .msg.assistant .meta a:hover { color: #1f1f1f; }
  .msg.error .bubble { color: #c0392b; }

  .clarification-form { margin-top: 16px; padding: 20px; border: 1px solid #e5e5e5; border-radius: 12px; background: #fafafa; max-width: 480px; }
  .clarification-form strong { display: block; margin-bottom: 16px; font-size: 14px; }
  .clarification-form label { display: block; margin-bottom: 16px; }
  .clarification-form label span { display: block; margin-bottom: 6px; font-size: 14px; }
  .clarification-form input, .clarification-form select { box-sizing: border-box; width: 100%; min-height: 42px; padding: 9px 12px; border: 1px solid #d4d4d4; border-radius: 8px; background: #fff; color: #1f1f1f; font: inherit; font-size: 16px; }
  .clarification-form input:focus, .clarification-form select:focus { outline: 2px solid #737373; outline-offset: 2px; }
  .clarification-form small { display: block; margin-top: 5px; color: #666; font-size: 12px; }
  .clarification-form .clarification-options { border: 1px solid #d4d4d4; border-radius: 8px; margin: 0 0 16px; padding: 12px; min-width: 0; }
  .clarification-form .clarification-options legend { padding: 0 4px; font-size: 14px; }
  .clarification-form .clarification-option { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; min-height: 32px; }
  .clarification-form .clarification-option span { margin: 0; }
  .clarification-form input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; margin: 0; accent-color: #1f1f1f; flex: 0 0 auto; }
  .clarification-form .clarification-selection-error { color: #b42318; }
  .clarification-form button { min-height: 42px; padding: 10px 18px; border: 0; border-radius: 8px; background: #1f1f1f; color: white; cursor: pointer; }
  .clarification-form :disabled { opacity: .5; cursor: default; }
  .clarification-form .clarification-reason { margin: 6px 0 0; font-size: 13px; line-height: 1.6; }
  .clarification-form .clarification-reason.invalid { color: #b42318; }
  .clarification-form .clarification-reason.confirm { color: #855512; }
  .clarification-form [aria-invalid="true"] { border-color: #b42318; }
  .clarification-form p { margin-top: 10px; font-size: 12px; color: #666; }

  /* 加载动画 */
  .loading { display: inline-flex; gap: 5px; padding: 8px 0; }
  .loading span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #b0b0b0;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .loading span:nth-child(2) { animation-delay: .15s; }
  .loading span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── 输入区 ─────────────────────────────── */
  #input-area {
    flex: 0 0 auto;
    padding: 12px 0 max(20px, env(safe-area-inset-bottom, 0px));
    max-height: 65%;
    overflow-y: auto;
  }
  #app.empty #input-area { padding-bottom: 0; }
  #input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: #fff;
    border: 1px solid #e4e4e7;
    border-radius: 24px;
    padding: 14px 14px 14px 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
    transition: border-color .15s;
  }
  #input-box:focus-within { border-color: #1f1f1f; }
  #question {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    resize: none;
    font-size: 16px;
    line-height: 1.5;
    font-family: inherit;
    background: transparent;
    max-height: 180px;
  }
  #send {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: #1f1f1f;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s;
  }
  #send:disabled { opacity: .3; cursor: not-allowed; }
  #send svg { width: 18px; height: 18px; }

  /* ── 执行进度（置灰只读） ─────────────────── */
  #progress {
    display: none;
    width: 100%;
    background: #efeff0;
    color: #8a8a8a;
    border: 1px solid #e4e4e7;
    border-radius: 12px;
    font-size: 13px;
    font-family: inherit;
    line-height: 1.7;
    resize: none;
    outline: none;
    padding: 10px 14px;
    margin-bottom: 10px;
    overflow-y: auto;
  }
.monitor-confirmation { margin-top:14px; padding:16px; border:1px solid #d4dedb; border-radius:12px; background:#f6faf8; font-size:14px; }
.monitor-confirmation p { margin:10px 0; }
.monitor-confirmation ol { padding-left:20px; }
.monitor-confirmation li { margin:8px 0; white-space:pre-wrap; }
.monitor-confirmation button { margin:6px 8px 0 0; padding:8px 12px; cursor:pointer; border:1px solid #a9c2b7; border-radius:6px; background:white; color:#204a37; }
.monitor-confirmation button:disabled { opacity:.45; cursor:not-allowed; }
.monitor-confirmation input { display:block; margin:8px 0; padding:8px; max-width:100%; width:290px; }
.monitor-confirmation pre { overflow:auto; max-height:260px; font-size:12px; }
</style>
</head>
<body>
<div id="app" class="empty">
  <div id="hero">
    <h1>CEXPilot</h1>
    <p style="font-size:14px;color:#6b7280">也可以说「监控 BTC 最近一小时跌幅超过 2%，发邮件提醒」</p>
    <p>加密货币交易 AI Copilot · 行情、资金费率、持仓量、链上交易，随便问</p>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="progress" readonly disabled rows="1"></textarea>
    <div id="input-box">
      <textarea id="question" rows="1" placeholder="问点什么，例如：BTC 最近一小时怎么了？"></textarea>
      <button id="send" title="发送" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script src="/monitor-confirmation.js"></script>
<script src="/clarification-form.js"></script>
<script>
(function () {
  var app = document.getElementById('app');
  var messages = document.getElementById('messages');
  var textarea = document.getElementById('question');
  var sendBtn = document.getElementById('send');
  var progressBox = document.getElementById('progress');

  var conversationId = null;
  // 每个页面自己维护；不能用共享 localStorage 静默覆盖另一个标签页看到的上下文。
  var parentTurnId = '';
  var historyLoading = true;
  var contextConflict = false;
  var pending = false;
  var clarificationForms = [];
  var followLatest = true;

  // 用户离开底部阅读历史后，流式回复和异步卡片更新都不能抢回滚动位置。
  messages.addEventListener('scroll', function () {
    followLatest = messages.scrollHeight - messages.clientHeight - messages.scrollTop <= 48;
  }, {passive:true});
  messages.addEventListener('wheel', function (event) {
    if (event.deltaY < 0) followLatest = false;
  }, {passive:true});
  var touchY = null;
  messages.addEventListener('touchstart', function (event) {
    touchY = event.touches.length ? event.touches[0].clientY : null;
  }, {passive:true});
  messages.addEventListener('touchmove', function (event) {
    var y = event.touches.length ? event.touches[0].clientY : null;
    if (touchY !== null && y !== null && y > touchY) followLatest = false;
    touchY = y;
  }, {passive:true});

  // 软键盘可能只缩小可视视口；同时跟随其偏移，保持输入框可见。
  if (window.visualViewport) {
    function syncViewport() {
      var viewport = window.visualViewport;
      // 缩放时保留浏览器原生的放大/平移行为。
      document.body.style.height = viewport.scale === 1 ? viewport.height + 'px' : '';
      document.body.style.top = viewport.scale === 1 ? viewport.offsetTop + 'px' : '';
    }
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
    window.addEventListener('resize', syncViewport);
    syncViewport();
  }
  if (window.ResizeObserver) {
    var layoutObserver = new window.ResizeObserver(function () { scrollToBottom(); });
    layoutObserver.observe(messages);
    layoutObserver.observe(document.getElementById('input-area'));
  }
  if (window.MutationObserver) {
    // Monitor确认卡片会在请求完成后异步刷新；仍跟随底部时一并跟随。
    new window.MutationObserver(function () { scrollToBottom(); })
      .observe(messages, {childList:true,subtree:true,characterData:true});
  }

  // 执行进度框：请求期间显示在输入框上方，逐行追加阶段文案，结束后隐藏
  function showProgress() {
    progressBox.value = '';
    progressBox.style.height = 'auto';
    progressBox.style.display = 'block';
  }

  function appendProgress(text) {
    progressBox.value += (progressBox.value ? '\n' : '') + text;
    progressBox.style.height = 'auto';
    progressBox.style.height = Math.min(progressBox.scrollHeight, 120) + 'px';
  }

  function hideProgress() {
    progressBox.style.display = 'none';
    progressBox.value = '';
  }

  function refreshClarifications() {
    clarificationForms.forEach(function (form) { form.refresh(); });
  }
  function renderClarification(div, fields, turnId) {
    if (!window.ClarificationForm) return;
    var form = window.ClarificationForm.render(div, fields, {
      isCurrent: function () { return !!turnId && turnId === parentTurnId && !contextConflict; },
      canSubmit: function () { return !pending && !historyLoading && !contextConflict; },
      onSubmit: function (question, answers) { return send(question, answers); }
    });
    if (form) clarificationForms.push(form);
  }

  function autoResize() {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
    sendBtn.disabled = pending || historyLoading || contextConflict || textarea.value.trim() === '';
    refreshClarifications();
  }

  function scrollToBottom(force) {
    if (force) followLatest = true;
    if (followLatest) messages.scrollTop = messages.scrollHeight;
  }

  function addMessage(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    messages.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addLoading() {
    var div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
    messages.appendChild(div);
    scrollToBottom();
    return div;
  }

  function send(supplement, answers) {
    var question = typeof supplement === 'string' ? supplement.trim() : textarea.value.trim();
    if (!question || pending || historyLoading || contextConflict) return Promise.resolve(false);

    app.className = 'chatting';
    followLatest = true; // 用户主动发送新问题时回到本轮回复。
    pending = true;
    if (typeof supplement !== 'string') textarea.value = '';
    autoResize();
    showProgress();

    addMessage('user', question);
    var loadingEl = addLoading();
    scrollToBottom(true);
    var answerDiv = null;
    var answerBubble = null;
    var terminalReceived = false;
    var requestCompleted = false;

    function appendDelta(text) {
      if (!answerDiv) {
        loadingEl.remove();
        answerDiv = addMessage('assistant', '');
        answerBubble = answerDiv.querySelector('.bubble');
      }
      answerBubble.textContent += text;
      scrollToBottom();
    }

    // SSE 事件块：event: <name>\ndata: <json>\n\n（data 为单行 JSON，换行已转义）
    function handleEvent(raw) {
      var name = 'message';
      var data = '';
      raw.split('\n').forEach(function (line) {
        if (line.indexOf('event:') === 0) name = line.slice(6).trim();
        else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
      });
      if (!data) return;
      var payload;
      try { payload = JSON.parse(data); } catch (e) { return; }
      if (name === 'meta') {
        conversationId = payload.conversationId;
      } else if (name === 'progress') {
        appendProgress(payload.text);
      } else if (name === 'delta') {
        appendDelta(payload.text);
      } else if (name === 'done') {
        terminalReceived = true;
        requestCompleted = !payload.busy;
        if (!payload.busy && payload.turnId) parentTurnId = payload.turnId;
        hideProgress();
        if (!answerDiv) {
          loadingEl.remove();
          answerDiv = addMessage('assistant', '（无回答）');
        }
        appendMeta(answerDiv, payload.toolCalls, payload.durationMs, payload.traceId);
        renderClarification(answerDiv, payload.clarify, payload.turnId);
        if (window.MonitorConfirmation) window.MonitorConfirmation.render(answerDiv,payload.planning);
      } else if (name === 'error') {
        terminalReceived = true;
        // meta 只是请求开始；只有 done 或已提交失败的 error 才能推进父轮次。
        if (payload.turnId) parentTurnId = payload.turnId;
        if (payload.code === 'CONTEXT_CONFLICT' || !payload.turnId) requireHistoryRefresh();
        hideProgress();
        loadingEl.remove();
        addMessage('error', payload.error || '请求失败，请稍后再试');
      }
    }

    function pump(reader, decoder, buffer) {
      return reader.read().then(function (r) {
        if (r.done) {
          if (buffer.trim()) handleEvent(buffer);
          if (!terminalReceived) throw new Error('连接中断，结果尚未确认，请刷新历史后继续。');
          return;
        }
        buffer += decoder.decode(r.value, { stream: true });
        var idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          handleEvent(buffer.slice(0, idx));
          buffer = buffer.slice(idx + 2);
        }
        return pump(reader, decoder, buffer);
      });
    }

    return fetch('/api/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversationId: conversationId,
        parentTurnId: parentTurnId,
        question: question,
        clarificationAnswers: answers || undefined,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null
      })
    })
      .then(function (res) {
        if (!res.ok || !res.body) {
          return res.json().then(function (body) {
            if (body.code === 'CONTEXT_CONFLICT') requireHistoryRefresh();
            throw new Error(body.error || '请求失败，请稍后再试');
          });
        }
        return pump(res.body.getReader(), new TextDecoder('utf-8'), '');
      })
      .catch(function (e) {
        requestCompleted = false;
        requireHistoryRefresh();
        hideProgress();
        loadingEl.remove();
        addMessage('error', e.message || '网络异常，请稍后再试');
      })
      .finally(function () {
        pending = false;
        autoResize();
        if (followLatest) textarea.focus({preventScroll:true});
      }).then(function () { return requestCompleted && !contextConflict; });
  }

  function requireHistoryRefresh() {
    if (contextConflict) return;
    contextConflict = true;
    var div = addMessage('error', '请先刷新历史，确认当前对话后再提问。');
    var button = document.createElement('button');
    button.textContent = '刷新历史';
    button.addEventListener('click', function () { window.location.reload(); });
    div.querySelector('.bubble').appendChild(button);
    autoResize();
  }

  // 回答下方的 meta 行：可选的工具统计 + trace 回放链接
  function appendMeta(div, toolCalls, durationMs, traceId) {
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (toolCalls > 0
      ? '调用 ' + toolCalls + ' 个数据工具 · 耗时 ' + (durationMs / 1000).toFixed(1) + 's · '
      : '');
    if (traceId) {
      var link = document.createElement('a');
      link.href = '/trace.html?id=' + encodeURIComponent(traceId);
      link.target = '_blank';
      link.textContent = '查看 trace';
      meta.appendChild(link);
    }
    if (meta.textContent || traceId) div.appendChild(meta);
  }

  // 页面加载时拉取该访客（cexpilot_uid cookie）最近会话的全部问答历史并回显
  function loadHistory() {
    fetch('/api/conversation/latest')
      .then(function (res) {
        if (!res.ok) throw new Error('历史读取失败');
        return res.json();
      })
      .then(function (data) {
        if (!data || !data.conversationId || !data.messages || data.messages.length === 0) return;
        conversationId = data.conversationId;
        parentTurnId = data.parentTurnId || '';
        app.className = 'chatting';
        data.messages.forEach(function (m) {
          addMessage('user', m.question);
          if (m.answer) {
            var div = addMessage('assistant', m.answer);
            appendMeta(div, 0, 0, m.traceId);
            renderClarification(div, m.clarify, m.turnId);
            if (window.MonitorConfirmation) window.MonitorConfirmation.render(div,m.planning);
          }
        });
      })
      .catch(function () { requireHistoryRefresh(); })
      .finally(function () {
        historyLoading = false; autoResize();
        if (window.MonitorConfirmation) {
          window.MonitorConfirmation.recover(function () {
            app.className = 'chatting'; return addMessage('assistant','已恢复的监控任务');
          }).catch(function () { /* 首次访问无访客 cookie 时没有可恢复监控。 */ });
        }
        if (window.MonitorConfirmation && window.location.search) {
          var linked = new URLSearchParams(window.location.search).get('monitor');
          if (linked) {
            app.className = 'chatting';
            window.MonitorConfirmation.openLinked(addMessage('assistant','监控任务'),window.location.search);
          }
        }
      });
  }

  textarea.addEventListener('input', autoResize);
  textarea.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  // 点输入框容器的留白区域（textarea 之外的上半部分）也聚焦 textarea
  document.getElementById('input-box').addEventListener('click', function (e) {
    if (e.target !== sendBtn && !sendBtn.contains(e.target)) {
      textarea.focus();
    }
  });

  loadHistory();
  textarea.focus({preventScroll:true});
})();
</script>
</body>
</html>
