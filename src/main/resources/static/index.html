<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEXPilot</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: #f7f7f8;
    color: #1f1f1f;
    display: flex;
    flex-direction: column;
  }

  /* ── 初始态：输入框居中 ───────────────────── */
  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
  }
  #app.empty { justify-content: center; }

  #hero { display: none; text-align: center; margin-bottom: 28px; }
  #app.empty #hero { display: block; }
  #hero h1 { font-size: 32px; font-weight: 600; letter-spacing: 1px; }
  #hero p { margin-top: 10px; color: #8a8a8a; font-size: 14px; }

  /* ── 对话区 ─────────────────────────────── */
  #messages {
    display: none;
    flex: 1;
    overflow-y: auto;
    padding: 32px 0 24px;
  }
  #app.chatting #messages { display: block; }

  .msg { margin-bottom: 28px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: #1f1f1f;
    color: #fff;
    border-radius: 18px 18px 4px 18px;
    padding: 12px 18px;
    max-width: 75%;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 15px;
    line-height: 1.6;
  }
  .msg.assistant .bubble {
    font-size: 15px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.assistant .meta {
    margin-top: 8px;
    font-size: 12px;
    color: #9a9a9a;
  }
  .msg.assistant .meta a { color: #9a9a9a; text-decoration: none; border-bottom: 1px dotted #c5c5c5; }
  .msg.assistant .meta a:hover { color: #1f1f1f; }
  .msg.error .bubble { color: #c0392b; }

  /* 加载动画 */
  .loading { display: inline-flex; gap: 5px; padding: 8px 0; }
  .loading span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #b0b0b0;
    animation: bounce 1.2s infinite ease-in-out;
  }
  .loading span:nth-child(2) { animation-delay: .15s; }
  .loading span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── 输入区 ─────────────────────────────── */
  #input-area { padding: 12px 0 20px; }
  #app.empty #input-area { padding-bottom: 0; }
  #input-box {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: #fff;
    border: 1px solid #e4e4e7;
    border-radius: 24px;
    padding: 14px 14px 14px 22px;
    box-shadow: 0 4px 18px rgba(0,0,0,.06);
    transition: border-color .15s;
  }
  #input-box:focus-within { border-color: #1f1f1f; }
  #question {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-size: 16px;
    line-height: 1.5;
    font-family: inherit;
    background: transparent;
    max-height: 180px;
  }
  #send {
    flex-shrink: 0;
    width: 38px; height: 38px;
    border: none;
    border-radius: 50%;
    background: #1f1f1f;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .15s;
  }
  #send:disabled { opacity: .3; cursor: not-allowed; }
  #send svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div id="app" class="empty">
  <div id="hero">
    <h1>CEXPilot</h1>
    <p>加密货币交易 AI Copilot · 行情、资金费率、持仓量、链上交易，随便问</p>
  </div>

  <div id="messages"></div>

  <div id="input-area">
    <div id="input-box">
      <textarea id="question" rows="1" placeholder="问点什么，例如：BTC 最近一小时怎么了？"></textarea>
      <button id="send" title="发送" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  var app = document.getElementById('app');
  var messages = document.getElementById('messages');
  var textarea = document.getElementById('question');
  var sendBtn = document.getElementById('send');

  var conversationId = null;
  var pending = false;

  function autoResize() {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
    sendBtn.disabled = pending || textarea.value.trim() === '';
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
    window.scrollTo(0, document.body.scrollHeight);
  }

  function addMessage(role, text) {
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    div.appendChild(bubble);
    messages.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addLoading() {
    var div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
    messages.appendChild(div);
    scrollToBottom();
    return div;
  }

  function send() {
    var question = textarea.value.trim();
    if (!question || pending) return;

    app.className = 'chatting';
    pending = true;
    textarea.value = '';
    autoResize();

    addMessage('user', question);
    var loadingEl = addLoading();
    var answerDiv = null;
    var answerBubble = null;

    function appendDelta(text) {
      if (!answerDiv) {
        loadingEl.remove();
        answerDiv = addMessage('assistant', '');
        answerBubble = answerDiv.querySelector('.bubble');
      }
      answerBubble.textContent += text;
      scrollToBottom();
    }

    // SSE 事件块：event: <name>\ndata: <json>\n\n（data 为单行 JSON，换行已转义）
    function handleEvent(raw) {
      var name = 'message';
      var data = '';
      raw.split('\n').forEach(function (line) {
        if (line.indexOf('event:') === 0) name = line.slice(6).trim();
        else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
      });
      if (!data) return;
      var payload;
      try { payload = JSON.parse(data); } catch (e) { return; }
      if (name === 'meta') {
        conversationId = payload.conversationId;
      } else if (name === 'delta') {
        appendDelta(payload.text);
      } else if (name === 'done') {
        if (!answerDiv) {
          loadingEl.remove();
          answerDiv = addMessage('assistant', '（无回答）');
        }
        appendMeta(answerDiv, payload.toolCalls, payload.durationMs, payload.traceId);
      } else if (name === 'error') {
        loadingEl.remove();
        addMessage('error', payload.error || '请求失败，请稍后再试');
      }
    }

    function pump(reader, decoder, buffer) {
      return reader.read().then(function (r) {
        if (r.done) {
          if (buffer.trim()) handleEvent(buffer);
          return;
        }
        buffer += decoder.decode(r.value, { stream: true });
        var idx;
        while ((idx = buffer.indexOf('\n\n')) >= 0) {
          handleEvent(buffer.slice(0, idx));
          buffer = buffer.slice(idx + 2);
        }
        return pump(reader, decoder, buffer);
      });
    }

    fetch('/api/ask/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        conversationId: conversationId,
        question: question,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null
      })
    })
      .then(function (res) {
        if (!res.ok || !res.body) {
          return res.json().then(function (body) {
            throw new Error(body.error || '请求失败，请稍后再试');
          });
        }
        return pump(res.body.getReader(), new TextDecoder('utf-8'), '');
      })
      .catch(function (e) {
        loadingEl.remove();
        addMessage('error', e.message || '网络异常，请稍后再试');
      })
      .finally(function () {
        pending = false;
        autoResize();
        textarea.focus();
      });
  }

  // 回答下方的 meta 行：可选的工具统计 + trace 回放链接
  function appendMeta(div, toolCalls, durationMs, traceId) {
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (toolCalls > 0
      ? '调用 ' + toolCalls + ' 个数据工具 · 耗时 ' + (durationMs / 1000).toFixed(1) + 's · '
      : '');
    if (traceId) {
      var link = document.createElement('a');
      link.href = '/trace.html?id=' + encodeURIComponent(traceId);
      link.target = '_blank';
      link.textContent = '查看 trace';
      meta.appendChild(link);
    }
    if (meta.textContent || traceId) div.appendChild(meta);
  }

  // 页面加载时拉取该访客（cexpilot_uid cookie）最近会话的全部问答历史并回显
  function loadHistory() {
    fetch('/api/conversation/latest')
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (data) {
        if (!data || !data.conversationId || !data.messages || data.messages.length === 0) return;
        conversationId = data.conversationId;
        app.className = 'chatting';
        data.messages.forEach(function (m) {
          addMessage('user', m.question);
          if (m.answer) {
            var div = addMessage('assistant', m.answer);
            appendMeta(div, 0, 0, m.traceId);
          }
        });
      })
      .catch(function () { /* 历史拉取失败不阻塞提问 */ });
  }

  textarea.addEventListener('input', autoResize);
  textarea.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  // 点输入框容器的留白区域（textarea 之外的上半部分）也聚焦 textarea
  document.getElementById('input-box').addEventListener('click', function (e) {
    if (e.target !== sendBtn && !sendBtn.contains(e.target)) {
      textarea.focus();
    }
  });

  loadHistory();
  textarea.focus();
})();
</script>
</body>
</html>
