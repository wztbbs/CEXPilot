# 启动时加载到内存；修改此文件后重启生效。支持用 HOME_SUGGESTIONS_LOCATION=file:/path/queries.yml 覆盖。
queries:
  - id: capabilities
    category: 了解 MarketPilot
    query: 你能实现哪些功能？
    pinned: true
    answer: |
      MarketPilot 目前支持：

      • 查行情：币安、OKX 的 USDT 现货与永续价格、24小时涨跌幅、成交量额、K线和盘口。
      • 查合约指标：永续持仓量、标记价、指数价，以及最近 N 期已结算资金费率。
      • 做计算：平均、合计、最高最低、大小比较、差值、倍数、变化率和年化，支持已接入的时间窗口。
      • 设监控：按支持的行情条件持续检查，确认条件和通知邮箱后启用邮件提醒。

      不同交易所、市场和指标的支持范围有所不同。例如：主动买卖统计目前仅接入币安；资金费率支持最近 N 期已结算值，尚未接入按时间窗口查询；监控每5分钟检查一次，当前仅支持同一交易所、市场和品种的条件。

      你可以直接说：“比较币安和 OKX 的 BTC 最近3期已结算资金费率均值。”
  - id: btc-price
    category: 看行情
    query: 币安 BTC/USDT 永续现在的最新成交价是多少？
  - id: yesterday-turnover
    category: 时间窗口
    query: 币安 BTC/USDT 永续昨天一整天的成交额是多少？
  - id: rolling-close-avg
    category: 时间窗口
    query: 币安 BTC/USDT 永续最近 6 小时内，按已完结的 1 小时 K 线计算，收盘价的等权平均是多少？
  - id: funding-sum
    category: 聚合比较
    query: 币安 BTC/USDT 永续最近 10 期已结算资金费率加起来是多少？
  - id: funding-extrema
    category: 聚合比较
    query: 币安 BTC/USDT 永续最近 10 期已结算资金费率，最高和最低分别是多少？
  - id: funding-avg-compare
    category: 聚合比较
    query: 比较币安和 OKX 的 BTC/USDT 永续最近 3 期已结算资金费率均值，哪家更高？
  - id: change-compare
    category: 聚合比较
    query: 比较币安和 OKX 的 BTC/USDT 永续昨天一整天的涨跌幅，哪家更高？
  - id: turnover-difference
    category: 聚合比较
    query: 币安与 OKX 的 BTC/USDT 永续昨天一整天的成交额相差多少？按币安减 OKX 计算。
  - id: turnover-ratio
    category: 聚合比较
    query: 币安 BTC/USDT 永续昨天一整天的成交额，是 OKX 同一合约同期成交额的多少倍？
  - id: btc-monitor
    category: 设监控
    query: 监控币安 BTC/USDT 永续最近一小时跌幅超过 2%，发邮件提醒。
